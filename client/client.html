<!DOCTYPE html>
<html lang="en">
<head>
  <title>Our simple HTTP server</title>
  <link rel="stylesheet" type="text/css" href="/style.css">
  
  <script>

  </script>
</head>
<body>
  <section id="top">
    <h3>POST Status Code Tests</h3>
    <form id="nameForm" action="/addUser" method="post">
      <label for="name">Name: </label>
      <input id="nameField" type="text" name="name" />
      <label for="age">Age: </label>
      <input id="ageField" type="number" name="age" min="0" max="100" step="1"/>
      <input type="submit" value="Add User" />
    </form>
    <form id="userForm" action="/getUsers" method="get">
      <select id='urlField'>
        <option value='/getUsers'>/getUsers</option>
        <option value='/notReal'>/notReal</option>
      </select>
      <select id="methodSelect">
        <option value="GET">GET</option>
        <option value="HEAD">HEAD</option>
      </select>
      <input type="submit" value="Get User" />
    </form>
  </section>
  <section id="content">
    <script>
      const nameForm = document.querySelector('#nameForm');
      const userForm = document.querySelector('#userForm');
      const nameField = document.querySelector('#nameField');
      const ageField = document.querySelector('#ageField');
      const urlField = document.querySelector('#urlField');
      const methodSelect = document.querySelector('#methodSelect');
      const content = document.querySelector('#content');

      // add user(POST), which will return 204 if the user already exists
      nameForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const name = nameField.value;
        const age = ageField.value;

        try {
          const response = await fetch('/addUser', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, age }),
          });

          // 204 has no body so no parsing
          if (response.status === 204) {
            console.log('204 No Content — user updated');
            content.innerHTML = '<p>Updated (No Content)</p>';
            return;
          }

          const data = await response.json();
          console.log('Response:', data);
          content.innerHTML = `<p>${data.message}</p>`;
        } catch (err) {
          console.error(err);
          content.innerHTML = '<p>Error contacting server.</p>';
        }
      });

      // get users(GET/HEAD), which will return 404 if the endpoint doesn't exist
      userForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const url = urlField.value;
        const method = methodSelect.value;

        try {
          const response = await fetch(url, { method });

          // HEAD has no body — don't try to parse it
          if (method === 'HEAD') {
            console.log(`HEAD ${url} -> ${response.status}`);
            content.innerHTML = `<p>Status: ${response.status} ${response.statusText} (no body for HEAD)</p>`;
            return;
          }

          const data = await response.json();
          console.log('Response:', data);

          if (response.ok) {
            content.innerHTML = `<p>${JSON.stringify(data)}</p>`;
          } else {
            content.innerHTML = `<p>${data.message}</p>`;
          }
        } catch (err) {
          console.error(err);
          content.innerHTML = '<p>Error contacting server.</p>';
        }
      });
    </script>
  </section>
</body>
</html>
